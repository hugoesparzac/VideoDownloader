name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Test
      run: dotnet test

    - name: Package
      env:
        TAG: ${{ github.ref_name }}
      run: ./scripts/publish.sh "${TAG#v}"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        FLAGS=""
        if [[ "$TAG" == *-* ]]; then FLAGS="--prerelease"; fi
        gh release create "$TAG" artifacts/*.zip artifacts/*.tar.gz \
          --title "$TAG" --generate-notes $FLAGS
